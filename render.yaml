services:
  - type: web
    name: attendx-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: attendx-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendx-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PROJECT_NAME
        value: "AttendX"

databases:
  - name: attendx-db
    databaseName: attendx
    user: attendx_user
    plan: free
